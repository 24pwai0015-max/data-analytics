<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="360" viewBox="0 0 1000 360"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Arsalan – Data analyst in the making, future Agent Automation Developer</title>

  <defs>
    <!-- Soft glow for the travelling ball -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle dot-grid pattern -->
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#9BA5B4" opacity="0.12"/>
    </pattern>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>

  <!-- Transparent background (dark + light mode safe) -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Dot grid behind the chart area -->
  <rect x="60" y="85" width="920" height="245" fill="url(#dots)" rx="4"/>

  <!-- ─── THE CHART LINE ─── -->
  <path id="chartLine"
        d="M80,300 L220,210 L380,255 L520,155 L660,185 L800,108 L920,125"
        stroke="#00D9FF" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="0 2000">
    <!--
      PHASE 1 – Draw the full line (3 s).
      Restarts after the erase phase finishes.
    -->
    <animate id="drawLine"
             attributeName="stroke-dasharray"
             from="0,2000" to="2000,0"
             dur="3s" fill="freeze"
             begin="0s; eraseLine.end + 0.4s"/>
    <!--
      PHASE 3 – Erase the line after the ball has finished (1 s).
    -->
    <animate id="eraseLine"
             attributeName="stroke-dasharray"
             from="2000,0" to="0,2000"
             dur="1s" fill="freeze"
             begin="ballMove.end + 0.4s"/>
  </path>

  <!-- ─── STATIC DATA-POINT MARKERS (appear with line, fade with erase) ─── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="drawLine.end"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.4s" fill="freeze" begin="ballMove.end + 0.2s"/>
    <circle cx="80"  cy="300" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="220" cy="210" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="380" cy="255" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="520" cy="155" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="660" cy="185" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="800" cy="108" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="920" cy="125" r="3.5" fill="#0A0E14" stroke="#00D9FF" stroke-width="1.5"/>
  </g>

  <!-- ─── THE GLOWING BALL ─── -->
  <!--
    PHASE 2 – After the line is fully drawn the ball fades in,
    travels the path in 4 s, then fades out at the top end.
    "ballMove.end" triggers the erase phase above.
  -->
  <circle r="6" fill="#00D9FF" opacity="0" filter="url(#glow)">
    <!-- Fade in → stay visible → fade out -->
    <animate attributeName="opacity"
             values="0;1;1;0"
             keyTimes="0;0.03;0.94;1"
             dur="4s" fill="freeze"
             begin="drawLine.end"/>
    <!-- Travel along the chart line -->
    <animateMotion id="ballMove"
                   dur="4s" fill="freeze"
                   begin="drawLine.end"
                   calcMode="linear">
      <mpath xlink:href="#chartLine"/>
    </animateMotion>
  </circle>

  <!-- ─── TEXT ─── -->
  <text x="18" y="38"
        font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
        font-size="34" font-weight="700" fill="#00D9FF">
    Arsalan
  </text>
  <text font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
        font-size="16" fill="#9BA5B4">
    <tspan x="18" y="65">Data analyst in the making</tspan>
    <tspan fill="#3DFFB0"> → </tspan>
    <tspan fill="#9BA5B4">Agent Automation Developer</tspan>
  </text>
</svg>
