<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fefcf7" />
    </linearGradient>

    <!-- Amber Flow Gradient -->
    <linearGradient id="amberFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#b45309" flood-opacity="0.06" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .step-num { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 700; fill: #b45309; letter-spacing: 1.5px; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; fill: #0f172a; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #64748b; }
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: pulseBeam 1.5s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="220" rx="14" fill="url(#pipeBg)" stroke="#fde68a" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(30, 30)">
    <circle cx="6" cy="6" r="4.5" fill="#f59e0b" filter="url(#softGlow)" />
    <text x="20" y="10.5" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#b45309" letter-spacing="2">DATA PIPELINE &amp; ANALYTICS LIFECYCLE</text>
  </g>

  <!-- Flow Lines Connecting Nodes -->
  <line x1="175" y1="120" x2="215" y2="120" stroke="url(#amberFlow)" stroke-width="2.2" class="flow-line" filter="url(#softGlow)" />
  <polygon points="215,116 223,120 215,124" fill="#d97706" />

  <line x1="355" y1="120" x2="395" y2="120" stroke="url(#amberFlow)" stroke-width="2.2" class="flow-line" filter="url(#softGlow)" />
  <polygon points="395,116 403,120 395,124" fill="#d97706" />

  <line x1="535" y1="120" x2="575" y2="120" stroke="url(#amberFlow)" stroke-width="2.2" class="flow-line" filter="url(#softGlow)" />
  <polygon points="575,116 583,120 575,124" fill="#d97706" />

  <line x1="715" y1="120" x2="755" y2="120" stroke="url(#amberFlow)" stroke-width="2.2" class="flow-line" filter="url(#softGlow)" />
  <polygon points="755,116 763,120 755,124" fill="#b45309" />

  <!-- NODE 1: Ingestion -->
  <g transform="translate(35, 65)">
    <rect width="140" height="110" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.2" filter="url(#boxShadow)" />
    <text x="14" y="24" class="step-num">STAGE 01</text>
    <text x="14" y="46" class="step-title">INGESTION</text>
    <text x="14" y="68" class="step-desc">• Raw CSVs &amp; APIs</text>
    <text x="14" y="85" class="step-desc">• Excel Data Sheets</text>
    <text x="14" y="102" class="step-desc">• Unstructured Web</text>
  </g>

  <!-- NODE 2: NumPy -->
  <g transform="translate(215, 65)">
    <rect width="140" height="110" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2" filter="url(#boxShadow)" />
    <text x="14" y="24" class="step-num">STAGE 02</text>
    <text x="14" y="46" class="step-title">NUMPY CORE</text>
    <text x="14" y="68" class="step-desc">• Vectorized Ops</text>
    <text x="14" y="85" class="step-desc">• Broadcasting</text>
    <text x="14" y="102" class="step-desc">• Boolean Masking</text>
  </g>

  <!-- NODE 3: Pandas -->
  <g transform="translate(395, 65)">
    <rect width="140" height="110" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2" filter="url(#boxShadow)" />
    <text x="14" y="24" class="step-num">STAGE 03</text>
    <text x="14" y="46" class="step-title">PANDAS WRANGLING</text>
    <text x="14" y="68" class="step-desc">• Imputation &amp; Cleaning</text>
    <text x="14" y="85" class="step-desc">• GroupBy &amp; Aggregates</text>
    <text x="14" y="102" class="step-desc">• Feature Engineering</text>
  </g>

  <!-- NODE 4: Visualization -->
  <g transform="translate(575, 65)">
    <rect width="140" height="110" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" filter="url(#boxShadow)" />
    <text x="14" y="24" class="step-num">STAGE 04</text>
    <text x="14" y="46" class="step-title">VISUALIZATION</text>
    <text x="14" y="68" class="step-desc">• Multi-Panel Figures</text>
    <text x="14" y="85" class="step-desc">• Seaborn Distributions</text>
    <text x="14" y="102" class="step-desc">• Categorical Plots</text>
  </g>

  <!-- NODE 5: Insights -->
  <g transform="translate(755, 65)">
    <rect width="110" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#boxShadow)" />
    <text x="12" y="24" class="step-num">STAGE 05</text>
    <text x="12" y="46" class="step-title" fill="#b45309">INSIGHTS</text>
    <text x="12" y="68" class="step-desc">• Visual Story</text>
    <text x="12" y="85" class="step-desc">• Titanic EDA</text>
    <text x="12" y="102" class="step-desc">• Executive Story</text>
  </g>
</svg>
