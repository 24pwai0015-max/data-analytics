<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <style>
      .mono-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #111827; letter-spacing: 2px; }
      .cube-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 800; fill: #111827; letter-spacing: 0.5px; text-anchor: middle; }
      .cube-sub { font-family: 'Consolas', 'Courier New', monospace; font-size: 9px; font-weight: 700; fill: #6B7280; letter-spacing: 1px; text-anchor: middle; }
      .grid-line { stroke: #E5E7EB; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="940" height="250" fill="#FFFFFF" stroke="#111827" stroke-width="1.8" />

  <!-- Top Bar -->
  <line x1="10" y1="42" x2="950" y2="42" stroke="#111827" stroke-width="1" />
  <text x="28" y="30" class="mono-title">DATA PIPELINE / FIVE-STAGE METHOD</text>

  <!-- Background grid accents -->
  <line x1="10" y1="180" x2="950" y2="180" class="grid-line" stroke-dasharray="4,4" />

  <!-- CUBE 1: INGEST (Amber) -->
  <g transform="translate(100, 115)">
    <!-- Top Face -->
    <polygon points="0,-32 40,-12 0,8 -40,-12" fill="#FBBF24" stroke="#111827" stroke-width="1.5" />
    <text x="0" y="-10" class="cube-text" fill="#111827">INGEST</text>
    <!-- Left Face -->
    <polygon points="-40,-12 0,8 0,48 -40,28" fill="#F59E0B" stroke="#111827" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,8 40,-12 40,28 0,48" fill="#D97706" stroke="#111827" stroke-width="1.5" />
    <!-- Sublabel -->
    <text x="0" y="78" class="cube-sub">CSV / EXCEL / API</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(195, 130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#111827" stroke-width="1.8" />
    <polygon points="45,-4 52,0 45,4" fill="#111827" />
  </g>

  <!-- CUBE 2: COMPUTE (Grey/Silver) -->
  <g transform="translate(290, 115)">
    <!-- Top Face -->
    <polygon points="0,-32 40,-12 0,8 -40,-12" fill="#F3F4F6" stroke="#111827" stroke-width="1.5" />
    <text x="0" y="-10" class="cube-text" fill="#111827">COMPUTE</text>
    <!-- Left Face -->
    <polygon points="-40,-12 0,8 0,48 -40,28" fill="#E5E7EB" stroke="#111827" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,8 40,-12 40,28 0,48" fill="#9CA3AF" stroke="#111827" stroke-width="1.5" />
    <!-- Sublabel -->
    <text x="0" y="78" class="cube-sub">NUMPY</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(385, 130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#111827" stroke-width="1.8" />
    <polygon points="45,-4 52,0 45,4" fill="#111827" />
  </g>

  <!-- CUBE 3: TRANSFORM (Amber) -->
  <g transform="translate(480, 115)">
    <!-- Top Face -->
    <polygon points="0,-32 40,-12 0,8 -40,-12" fill="#FBBF24" stroke="#111827" stroke-width="1.5" />
    <text x="0" y="-10" class="cube-text" fill="#111827">TRANSFORM</text>
    <!-- Left Face -->
    <polygon points="-40,-12 0,8 0,48 -40,28" fill="#F59E0B" stroke="#111827" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,8 40,-12 40,28 0,48" fill="#D97706" stroke="#111827" stroke-width="1.5" />
    <!-- Sublabel -->
    <text x="0" y="78" class="cube-sub">PANDAS</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(575, 130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#111827" stroke-width="1.8" />
    <polygon points="45,-4 52,0 45,4" fill="#111827" />
  </g>

  <!-- CUBE 4: VISUALIZE (Grey/Silver) -->
  <g transform="translate(670, 115)">
    <!-- Top Face -->
    <polygon points="0,-32 40,-12 0,8 -40,-12" fill="#F3F4F6" stroke="#111827" stroke-width="1.5" />
    <text x="0" y="-10" class="cube-text" fill="#111827">VISUALIZE</text>
    <!-- Left Face -->
    <polygon points="-40,-12 0,8 0,48 -40,28" fill="#E5E7EB" stroke="#111827" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,8 40,-12 40,28 0,48" fill="#9CA3AF" stroke="#111827" stroke-width="1.5" />
    <!-- Sublabel -->
    <text x="0" y="78" class="cube-sub">MATPLOTLIB / SEABORN</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(765, 130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#111827" stroke-width="1.8" />
    <polygon points="45,-4 52,0 45,4" fill="#111827" />
  </g>

  <!-- CUBE 5: EXPLAIN (Vibrant Lime) -->
  <g transform="translate(860, 115)">
    <!-- Top Face -->
    <polygon points="0,-32 40,-12 0,8 -40,-12" fill="#D4F93B" stroke="#111827" stroke-width="1.5" />
    <text x="0" y="-10" class="cube-text" fill="#111827">EXPLAIN</text>
    <!-- Left Face -->
    <polygon points="-40,-12 0,8 0,48 -40,28" fill="#A3E635" stroke="#111827" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="0,8 40,-12 40,28 0,48" fill="#65A30D" stroke="#111827" stroke-width="1.5" />
    <!-- Sublabel -->
    <text x="0" y="78" class="cube-sub">EVIDENCE</text>
  </g>
</svg>