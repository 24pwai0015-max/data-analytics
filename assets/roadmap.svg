<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Data‑Analytics Roadmap – 5 phases</title>
  <style>
    .node { stroke: #00D9FF; stroke-width: 2; fill: #121822; }
    .label { font-family: ui-monospace, 'SF Mono', Consolas, 'Segoe UI', sans-serif; fill: #9BA5B4; font-size: 14px; }
    .active { fill: #00D9FF; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0% { r:6; opacity:1; } 50% { r:9; opacity:0.6; } 100% { r:6; opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation:none; } }
  </style>
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- Horizontal line -->
  <line x1="100" y1="100" x2="900" y2="100" stroke="#9BA5B4" stroke-width="2"/>
  <!-- Phase nodes -->
  <g class="node" transform="translate(150,100)">
    <circle r="8" class="active pulse"/>
    <text x="0" y="-20" class="label" text-anchor="middle">Phase 1<br/>Foundation</text>
  </g>
  <g class="node" transform="translate(350,100)">
    <circle r="8"/>
    <text x="0" y="-20" class="label" text-anchor="middle">Phase 2<br/>Automation</text>
  </g>
  <g class="node" transform="translate(550,100)">
    <circle r="8"/>
    <text x="0" y="-20" class="label" text-anchor="middle">Phase 3<br/>LLM APIs</text>
  </g>
  <g class="node" transform="translate(750,100)">
    <circle r="8"/>
    <text x="0" y="-20" class="label" text-anchor="middle">Phase 4<br/>Agent Automation</text>
  </g>
  <g class="node" transform="translate(950,100)">
    <circle r="8"/>
    <text x="0" y="-20" class="label" text-anchor="middle">Phase 5<br/>Freelance</text>
  </g>
</svg>
