<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="180" viewBox="0 0 1000 180"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="roadmapTitle">
  <title id="roadmapTitle">Learning Roadmap – 5 phases from Foundation to Freelance</title>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- ─── CONNECTING LINE (dashed) ─── -->
  <line x1="100" y1="90" x2="900" y2="90"
        stroke="#9BA5B4" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>

  <!-- ════════ PHASE 1 — Foundation  ·  IN PROGRESS ════════ -->
  <g transform="translate(100,90)">
    <!-- Outer pulse ring -->
    <circle r="18" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.25">
      <animate attributeName="r"       values="18;24;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.08;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Core node -->
    <circle r="10" fill="#00D9FF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0A0E14"/>
    <!-- Labels -->
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" font-weight="700" fill="#00D9FF">PHASE 1</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="10" fill="#9BA5B4">Foundation</text>
    <text y="44" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="9" fill="#3DFFB0">● in progress</text>
  </g>

  <!-- ════════ PHASE 2 — Automation  ·  FUTURE ════════ -->
  <g transform="translate(300,90)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.4"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.6">PHASE 2</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="10" fill="#9BA5B4" opacity="0.5">Automation</text>
  </g>

  <!-- ════════ PHASE 3 — LLM APIs  ·  FUTURE ════════ -->
  <g transform="translate(500,90)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.4"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.6">PHASE 3</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="10" fill="#9BA5B4" opacity="0.5">LLM APIs</text>
  </g>

  <!-- ════════ PHASE 4 — Agent Automation  ·  FUTURE ════════ -->
  <g transform="translate(700,90)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.4"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.6">PHASE 4</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="10" fill="#9BA5B4" opacity="0.5">Agents</text>
  </g>

  <!-- ════════ PHASE 5 — Freelance  ·  FUTURE ════════ -->
  <g transform="translate(900,90)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.4"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.6">PHASE 5</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="10" fill="#9BA5B4" opacity="0.5">Freelance</text>
  </g>
</svg>
