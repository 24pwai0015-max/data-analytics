<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100%">
  <defs>
    <!-- Background Card -->
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffdfa" />
    </linearGradient>

    <!-- Warm Amber Numbers Gradients -->
    <linearGradient id="amberNum1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amberNum2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="amberNum3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="amberNum4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#b45309" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 900; }
    .metric-label { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 700; fill: #64748b; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(0, 0)">
    <rect width="210" height="96" rx="12" fill="url(#whiteCard)" stroke="#fde68a" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="22" y="44" class="metric-value" fill="url(#amberNum1)">05 WEEKS</text>
    <text x="22" y="70" class="metric-label">Structured Syllabus</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(230, 0)">
    <rect width="210" height="96" rx="12" fill="url(#whiteCard)" stroke="#fcd34d" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="22" y="44" class="metric-value" fill="url(#amberNum2)">25+ LABS</text>
    <text x="22" y="70" class="metric-label">Scripts &amp; Mini-Projects</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(460, 0)">
    <rect width="210" height="96" rx="12" fill="url(#whiteCard)" stroke="#fbbf24" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="22" y="44" class="metric-value" fill="url(#amberNum3)">4 ENGINES</text>
    <text x="22" y="70" class="metric-label">NumPy • Pandas • Plt • Sns</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(690, 0)">
    <rect width="210" height="96" rx="12" fill="url(#whiteCard)" stroke="#f59e0b" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="22" y="44" class="metric-value" fill="url(#amberNum4)">100% REAL</text>
    <text x="22" y="70" class="metric-label">End-to-End Datasets</text>
  </g>
</svg>
