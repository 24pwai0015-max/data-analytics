<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" width="100%" height="100%">
  <defs>
    <style>
      .metric-box { fill: #FFFFFF; stroke: #111827; stroke-width: 1.8; }
      .metric-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 900; fill: #111827; letter-spacing: 0.5px; }
      .metric-val-amber { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 900; fill: #D97706; letter-spacing: 0.5px; }
      .metric-lbl { font-family: 'Consolas', monospace; font-size: 10px; font-weight: 700; fill: #6B7280; letter-spacing: 1.5px; text-transform: uppercase; }
      .sub-tag { font-family: 'Consolas', monospace; font-size: 9px; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <!-- Metric 1: Weeks -->
  <g transform="translate(10, 8)">
    <rect width="220" height="94" class="metric-box" />
    <line x1="0" y1="26" x2="220" y2="26" stroke="#111827" stroke-width="1" />
    <text x="14" y="18" class="sub-tag">01 / DURATION</text>
    <text x="14" y="58" class="metric-val">05 WEEKS</text>
    <text x="14" y="80" class="metric-lbl">Structured Curriculum</text>
  </g>

  <!-- Metric 2: Labs -->
  <g transform="translate(250, 8)">
    <rect width="220" height="94" class="metric-box" />
    <line x1="0" y1="26" x2="220" y2="26" stroke="#111827" stroke-width="1" />
    <text x="14" y="18" class="sub-tag">02 / LABS &amp; CODE</text>
    <text x="14" y="58" class="metric-val-amber">25+ SCRIPTS</text>
    <text x="14" y="80" class="metric-lbl">Executable Python Work</text>
  </g>

  <!-- Metric 3: Engines -->
  <g transform="translate(490, 8)">
    <rect width="220" height="94" class="metric-box" />
    <line x1="0" y1="26" x2="220" y2="26" stroke="#111827" stroke-width="1" />
    <text x="14" y="18" class="sub-tag">03 / STACK</text>
    <text x="14" y="58" class="metric-val">4 ENGINES</text>
    <text x="14" y="80" class="metric-lbl">NumPy · Pandas · Plt · Sns</text>
  </g>

  <!-- Metric 4: Case Studies -->
  <g transform="translate(730, 8)">
    <rect width="220" height="94" fill="#D4F93B" stroke="#111827" stroke-width="1.8" />
    <line x1="0" y1="26" x2="220" y2="26" stroke="#111827" stroke-width="1" />
    <text x="14" y="18" class="sub-tag">04 / EVIDENCE</text>
    <text x="14" y="58" class="metric-val">TITANIC EDA</text>
    <text x="14" y="80" class="metric-lbl" fill="#111827">9 Linked Inquiries</text>
  </g>
</svg>
