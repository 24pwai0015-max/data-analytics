<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .mono-label { font-family: 'Consolas', monospace; font-size: 12px; font-weight: 700; fill: #111827; letter-spacing: 2px; }
      .hero-solid { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 48px; font-weight: 900; fill: #111827; letter-spacing: 1px; }
      .hero-outline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 48px; font-weight: 900; fill: none; stroke: #111827; stroke-width: 2px; letter-spacing: 1px; }
      .tag-sub { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }
      .tag-amber { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 700; fill: #D97706; letter-spacing: 1px; }
      .cube-label { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #111827; }
    </style>
    <radialGradient id="sunAura" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <radialGradient id="darkPlanet" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="60%" stop-color="#1F242E" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>

  <!-- Technical Canvas -->
  <rect x="18" y="18" width="964" height="324" fill="#FFFFFF" stroke="#111827" stroke-width="2" />

  <!-- Top Bar -->
  <line x1="18" y1="52" x2="982" y2="52" stroke="#111827" stroke-width="1" />
  <text x="36" y="42" class="mono-label">DATA LAB / 001</text>
  <text x="800" y="42" class="mono-label">SCIENTIFIC COMPUTING</text>

  <!-- Technical Grid Background -->
  <g stroke="#F3F4F6" stroke-width="1">
    <line x1="480" y1="53" x2="480" y2="341" /><line x1="530" y1="53" x2="530" y2="341" />
    <line x1="580" y1="53" x2="580" y2="341" /><line x1="630" y1="53" x2="630" y2="341" />
    <line x1="680" y1="53" x2="680" y2="341" /><line x1="730" y1="53" x2="730" y2="341" />
    <line x1="780" y1="53" x2="780" y2="341" /><line x1="830" y1="53" x2="830" y2="341" />
    <line x1="880" y1="53" x2="880" y2="341" /><line x1="930" y1="53" x2="930" y2="341" />
    <line x1="480" y1="100" x2="981" y2="100" /><line x1="480" y1="150" x2="981" y2="150" />
    <line x1="480" y1="200" x2="981" y2="200" /><line x1="480" y1="250" x2="981" y2="250" />
    <line x1="480" y1="300" x2="981" y2="300" />
  </g>

  <!-- Typography Left -->
  <text x="50" y="112" class="hero-solid">DATA</text>
  <text x="50" y="167" class="hero-solid">ANALYTICS</text>
  <text x="50" y="222" class="hero-outline">LABORATORY</text>
  <text x="52" y="270" class="tag-sub">NUMPY • PANDAS • MATPLOTLIB • SEABORN</text>
  <text x="52" y="292" class="tag-amber">VECTORIZED PIPELINES &amp; STATISTICAL STORYTELLING</text>

  <!-- Right Side Celestial Body & Orbit -->
  <g transform="translate(740, 180)">
    <!-- Back of Orbit Ring -->
    <ellipse cx="0" cy="0" rx="150" ry="48" fill="none" stroke="#C4B5FD" stroke-opacity="0.3" stroke-width="2" transform="rotate(-16)" />

    <!-- Dark Shaded Planet Sphere -->
    <circle cx="0" cy="0" r="82" fill="url(#darkPlanet)" stroke="#111827" stroke-width="1.8" />

    <!-- Glowing Sun / Star Inside -->
    <circle cx="-24" cy="-14" r="34" fill="url(#sunAura)" />

    <!-- Front Orbit Ring -->
    <path d="M -144 42 A 150 48 0 0 0 144 -42" fill="none" stroke="#D1D5DB" stroke-width="2" transform="rotate(-16)" />

    <!-- Orbiting Satellite Beacon -->
    <g transform="translate(138, -38)">
      <circle cx="0" cy="0" r="10" fill="#D4F93B" fill-opacity="0.5" />
      <circle cx="0" cy="0" r="6" fill="#A3E635" stroke="#111827" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>

    <!-- Isometric Blue Cube -->
    <g transform="translate(-120, 76)">
      <!-- Top -->
      <polygon points="0,-24 21,-12 0,0 -21,-12" fill="#60A5FA" stroke="#111827" stroke-width="1.2" />
      <!-- Left -->
      <polygon points="-21,-12 0,0 0,24 -21,12" fill="#2563EB" stroke="#111827" stroke-width="1.2" />
      <!-- Right -->
      <polygon points="0,0 21,-12 21,12 0,24" fill="#1D4ED8" stroke="#111827" stroke-width="1.2" />
      <!-- Label NU | -->
      <text x="30" y="6" class="cube-label">NU |</text>
    </g>
  </g>
</svg>