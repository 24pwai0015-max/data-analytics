<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Electric Voltage Gradient -->
    <linearGradient id="voltageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#7928ca;#ff007a;#00f5ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff007a;#00f5ff;#7928ca" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff007a">
        <animate attributeName="stop-color" values="#ff007a;#00f5ff;#7928ca;#ff007a" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141e33" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="1" fill="#00f5ff" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-size: 13.5px;
      letter-spacing: 2px;
      fill: #94a3b8;
    }
    .chip {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    @keyframes floatBeam {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .beam {
      stroke-dasharray: 120, 240;
      animation: floatBeam 4s linear infinite;
    }
    .beam-reverse {
      stroke-dasharray: 80, 200;
      animation: floatBeam 5s linear infinite reverse;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="960" height="280" rx="16" fill="url(#grid)" />

  <!-- Outer Neon Border Frame -->
  <rect width="956" height="276" x="2" y="2" rx="15" fill="none" stroke="url(#voltageGrad)" stroke-width="1.8" stroke-opacity="0.7" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="70" r="90" fill="#00f5ff" fill-opacity="0.08" filter="url(#superGlow)" />
  <circle cx="850" cy="200" r="110" fill="#ff007a" fill-opacity="0.07" filter="url(#superGlow)" />
  <circle cx="480" cy="140" r="80" fill="#7928ca" fill-opacity="0.10" filter="url(#superGlow)" />

  <!-- Kinetic Voltage Wave Paths -->
  <path d="M 0 220 Q 240 180, 480 230 T 960 190" fill="none" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.3" />
  <path d="M 0 220 Q 240 180, 480 230 T 960 190" fill="none" stroke="url(#voltageGrad)" stroke-width="3" class="beam" filter="url(#softGlow)" />

  <path d="M 0 70 Q 300 120, 600 60 T 960 100" fill="none" stroke="#ff007a" stroke-width="1" stroke-opacity="0.25" />
  <path d="M 0 70 Q 300 120, 600 60 T 960 100" fill="none" stroke="url(#voltageGrad)" stroke-width="2.5" class="beam-reverse" filter="url(#softGlow)" />

  <!-- Top Voltage Indicator Pill -->
  <g transform="translate(365, 24)">
    <rect width="230" height="26" rx="13" fill="#0c1527" stroke="url(#voltageGrad)" stroke-width="1.2" />
    <circle cx="18" cy="13" r="4" fill="#00f5ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="17.5" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="2">HIGH-VOLTAGE ANALYTICS</text>
  </g>

  <!-- Main Hero Heading -->
  <text x="480" y="112" text-anchor="middle" class="title" font-size="34" fill="url(#voltageGrad)" filter="url(#softGlow)">
    DATA ANALYTICS &amp; VISUAL STORYTELLING
  </text>

  <!-- Tagline Subtitle -->
  <text x="480" y="148" text-anchor="middle" class="subtitle">
    EXPLORATORY DATA ANALYSIS • VECTORIZED PIPELINES • STATISTICAL INSIGHTS
  </text>

  <!-- Glowing Separator Line with Central Spark -->
  <g transform="translate(180, 168)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#1e293b" stroke-width="1.5" />
    <line x1="150" y1="0" x2="450" y2="0" stroke="url(#voltageGrad)" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="x1" values="50;250;50" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="350;550;350" dur="4s" repeatCount="indefinite" />
    </line>
    <!-- Lightning Icon in Center -->
    <polygon points="300,-10 293,1 299,1 295,10 307,-1 301,-1" fill="#00f5ff" filter="url(#superGlow)">
      <animate attributeName="fill" values="#00f5ff;#ff007a;#7928ca;#00f5ff" dur="3s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Interactive Stack Chips / Visual Tags -->
  <g transform="translate(105, 198)">
    <!-- Chip 1: NumPy -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#091322" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="17" r="4" fill="#00f5ff" />
      <text x="30" y="21.5" fill="#e2e8f0" class="chip">NUMPY</text>
      <text x="85" y="21.5" fill="#64748b" class="chip" font-size="9">W01</text>
    </g>

    <!-- Chip 2: Pandas -->
    <g transform="translate(150, 0)">
      <rect width="135" height="34" rx="8" fill="#140922" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="17" r="4" fill="#a855f7" />
      <text x="30" y="21.5" fill="#e2e8f0" class="chip">PANDAS</text>
      <text x="92" y="21.5" fill="#64748b" class="chip" font-size="9">W02-04</text>
    </g>

    <!-- Chip 3: Matplotlib -->
    <g transform="translate(305, 0)">
      <rect width="145" height="34" rx="8" fill="#180b18" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="17" r="4" fill="#ec4899" />
      <text x="30" y="21.5" fill="#e2e8f0" class="chip">MATPLOTLIB</text>
      <text x="114" y="21.5" fill="#64748b" class="chip" font-size="9">W05</text>
    </g>

    <!-- Chip 4: Seaborn -->
    <g transform="translate(470, 0)">
      <rect width="130" height="34" rx="8" fill="#0a1928" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="17" r="4" fill="#38bdf8" />
      <text x="30" y="21.5" fill="#e2e8f0" class="chip">SEABORN</text>
      <text x="94" y="21.5" fill="#64748b" class="chip" font-size="9">W05</text>
    </g>

    <!-- Chip 5: Titanic Case Study -->
    <g transform="translate(620, 0)">
      <rect width="130" height="34" rx="8" fill="#19110b" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="16" cy="17" r="4" fill="#f59e0b" />
      <text x="30" y="21.5" fill="#fbbf24" class="chip">CASE STUDY</text>
      <text x="110" y="21.5" fill="#78350f" class="chip" font-size="8">⚡</text>
    </g>
  </g>

  <!-- Bottom Pulse Footer Indicator -->
  <g transform="translate(480, 258)">
    <text text-anchor="middle" font-family="'Fira Code', monospace" font-size="9.5" fill="#475569" letter-spacing="3">
      ⚡ PRODUCTION-READY WORKSPACE &amp; ARCHITECTED ROADMAP ⚡
    </text>
  </g>
</svg>
